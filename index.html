<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030D12" />
  <title>SẮC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css" />
  <script src="palette.js"></script>
  <link rel="stylesheet" href="splash.css" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="map.css" />
  <link rel="stylesheet" href="stream/stream.css" />
  <link rel="stylesheet" href="menu.css" />
  <script defer src="map.js"></script>
</head>
<body>

  <div id="splash-screen">
    <div id="splash-halftone"></div>

    <div id="splash-stage">
      <div id="splash-grid"></div>
      <img id="splash-logo-full" src="logo-sac.png" alt="SAC Logo" />
    </div>

    <!-- #map view: interactive map of Vietnam's regions and ethnic groups (see map.js) -->
    <section id="map-view" aria-label="Bản đồ các dân tộc Việt Nam">
      <button id="map-menu-btn" type="button" aria-label="Mở menu"><i></i><span>MENU</span></button>
      <div id="map-desc">
        <p class="lab">Bản đồ · 54 dân tộc</p>
        <p>Bản đồ tương tác các vùng dân tộc Việt Nam. Di chuột để nghiêng bản đồ, chọn một vùng để xem các dân tộc sinh sống.</p>
        <button id="map-back" type="button">← Giới thiệu</button>
      </div>
      <div id="m-scene"><div id="m-stage"></div></div>
      <div id="m-tip"></div>
      <div id="m-chips"></div>
      <aside id="m-card" aria-live="polite">
        <button id="m-x" type="button" aria-label="Đóng">×</button>
        <div class="hero" id="m-hero"></div>
        <div class="in">
          <h2 id="m-ct"></h2><div class="meta" id="m-cm"></div><p id="m-cb"></p>
          <div id="m-gs"></div><div id="m-gd"></div>
        </div>
      </aside>
    </section>

    <!-- Menu: opens when the SẮC logo is clicked (menu.js) -->
    <div id="sac-menu" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Menu">
      <div id="sac-veil"></div>
      <div id="sac-lattice"></div>
      <div id="sac-rail"></div>
      <button id="sac-close" type="button" aria-label="Đóng menu"><span>×</span></button>
      <ul id="sac-list">
        <li style="--i:0;--c:var(--coral)"><button class="sac-item" type="button" data-act="gallery"><span class="sac-idx">01</span><span class="sac-name">Gallery</span><span class="sac-sub">Thư viện</span></button><i class="sac-band"></i></li>
        <li style="--i:1;--c:var(--sky)"><button class="sac-item" type="button" data-act="map"><span class="sac-idx">02</span><span class="sac-name">Map</span><span class="sac-sub">Bản đồ các dân tộc</span></button><i class="sac-band"></i></li>
        <li style="--i:2;--c:var(--sand)"><button class="sac-item" type="button" data-act="archive" data-soon><span class="sac-idx">03</span><span class="sac-name">Archive</span><span class="sac-sub">Lưu trữ <em class="sac-soon">Sắp ra mắt</em></span></button><i class="sac-band"></i></li>
        <li style="--i:3;--c:var(--mint)"><button class="sac-item" type="button" data-act="about" data-soon><span class="sac-idx">04</span><span class="sac-name">About</span><span class="sac-sub">Về chúng tôi <em class="sac-soon">Sắp ra mắt</em></span></button><i class="sac-band"></i></li>
        <li style="--i:4;--c:var(--teal)"><button class="sac-item" type="button" data-act="contact" data-soon><span class="sac-idx">05</span><span class="sac-name">Contact</span><span class="sac-sub">Liên hệ <em class="sac-soon">Sắp ra mắt</em></span></button><i class="sac-band"></i></li>
      </ul>
      <p id="sac-foot">SẮC · 54 dân tộc · một dải thổ cẩm</p>
    </div>
  </div>

<!-- Replay SAC Splash Animation -->
  <button id="macro-toggle-btn" aria-label="Replay SAC Animation">
    <span class="btn-icon">[ ]</span>
    <span class="btn-text">HOME</span>
  </button>

  <div id="canvas-root"><!-- stream/main.js builds the gallery here --></div>

  <!-- Story viewer (stream/viewer.js): thổ cẩm brocade design -->
  <div id="viewer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Story">
    <div id="v-scrim"></div>
    <div id="v-stage"></div>
    <div id="v-frame"><i></i><i></i><i></i><i></i></div>
    <img id="v-img" alt="" draggable="false" />
    <aside id="v-panel">
      <div class="v-band" id="v-band-top"></div>
      <button id="v-close" type="button" aria-label="Close">×</button>
      <div class="v-pad">
        <span id="v-tag"></span>
        <h2 id="v-title"></h2>
        <p id="v-sub"></p>
        <div id="v-body"></div>
        <div class="v-bar">
          <button id="v-prev" type="button" aria-label="Previous story">←</button>
          <button id="v-next" type="button" aria-label="Next story">→</button>
          <span class="sp"></span>
          <button id="v-like" type="button" aria-label="Like">♥</button>
          <button id="v-share" type="button" aria-label="Copy link">LINK</button>
        </div>
        <div class="v-weave">
          <p>54 dân tộc, mỗi sợi chỉ là một câu chuyện cùng dệt nên một tấm thổ cẩm.</p>
          <div id="v-threads"></div>
        </div>
      </div>
      <div class="v-band" id="v-band-bot"></div>
    </aside>
  </div>

  <script src="splash.js"></script>
  <script src="images/manifest.js"></script><!-- generated by tools/build-images.mjs; optional -->
  <script src="stream/stories.js"></script>
  <script src="stream/images.js"></script>
  <script src="stream/layout.js"></script>
  <script src="stream/flow.js"></script>
  <script src="stream/gl.js"></script>
  <script src="stream/dom.js"></script>
  <script src="stream/weave.js"></script>
  <script src="menu.js"></script>
  <script src="stream/viewer.js"></script>
  <script src="stream/main.js"></script>
</body>
</html>
